name: Pinterest Automation - Mente Curiosa

on:
  schedule:
    - cron: '0 8,14,20 * * *'
  workflow_dispatch:

jobs:
  post-pinterest:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser anthropic python-dotenv
      
      - name: Run Pinterest Poster
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PINTEREST_PROFILE_ID: ${{ secrets.PINTEREST_PROFILE_ID }}
          PINTEREST_COOKIES: ${{ secrets.PINTEREST_COOKIES }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python pinterest_poster_prod.py
