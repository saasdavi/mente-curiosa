name: Distribute to Social Media (5 Pins + Facebook)

on:
  workflow_run:
    workflows: ["Generate Article"]
    types:
      - completed

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  social-distribution:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Get latest article info
        id: article-info
        run: |
          # Encontra o arquivo mais recente em src/content/blog
          LATEST_ARTICLE=$(ls -t src/content/blog/*.md 2>/dev/null | head -1)
          
          if [ -z "$LATEST_ARTICLE" ]; then
            echo "❌ Nenhum artigo encontrado"
            exit 1
          fi
          
          # Extrai slug do nome do arquivo
          SLUG=$(basename "$LATEST_ARTICLE" .md)
          SLUG=${SLUG#*-}  # Remove prefixo numérico (ex: 001-)
          
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "file=$LATEST_ARTICLE" >> $GITHUB_OUTPUT
          echo "✅ Artigo encontrado: $SLUG"

      - name: Extract article metadata
        id: metadata
        run: |
          FILE="${{ steps.article-info.outputs.file }}"
          
          # Extrai título (primeira linha com #)
          TITLE=$(grep "^#" "$FILE" | head -1 | sed 's/^# //')
          
          # Extrai resumo (próximos parágrafos após o título)
          SUMMARY=$(awk '/^#/{flag=1; next} flag && NF && !/^#{2,}/{print; if(++count==3) exit}' "$FILE" | head -c 200 | tr '\n' ' ')
          
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "📝 Título: $TITLE"

      - name: Generate 5 Pinterest variants (Gemini API Free)
        id: variants
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARTICLE_SLUG: ${{ steps.article-info.outputs.slug }}
          ARTICLE_TITLE: ${{ steps.metadata.outputs.title }}
          ARTICLE_SUMMARY: ${{ steps.metadata.outputs.summary }}
        run: |
          node pinterest-variants-gemini.js
          echo "variants_file=src/content/pinterest/${{ steps.article-info.outputs.slug }}-variants.json" >> $GITHUB_OUTPUT

      - name: Generate 5 unique images from Pexels
        id: images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ARTICLE_SLUG: ${{ steps.article-info.outputs.slug }}
        run: |
          # Extrai palavras-chave do título para buscas variadas
          KEYWORD_1=$(echo "${{ steps.metadata.outputs.title }}" | cut -d' ' -f1-2)
          KEYWORD_2=$(echo "${{ steps.metadata.outputs.title }}" | cut -d' ' -f2-4)
          KEYWORD_3=$(echo "${{ steps.metadata.outputs.title }}" | awk '{print $NF}')
          
          # Array pra guardar as 5 URLs
          declare -a IMAGES
          
          # Busca 1
          RESPONSE=$(curl -s -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/search?query=$KEYWORD_1&per_page=1&orientation=landscape")
          IMG=$(echo $RESPONSE | jq -r '.photos[0].src.medium // empty')
          IMAGES[0]="${IMG:-https://images.unsplash.com/photo-1516321318423-f06f70d504f0?w=800}"
          
          # Busca 2 (palavra-chave diferente)
          RESPONSE=$(curl -s -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/search?query=$KEYWORD_2&per_page=1&orientation=portrait")
          IMG=$(echo $RESPONSE | jq -r '.photos[0].src.medium // empty')
          IMAGES[1]="${IMG:-https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800}"
          
          # Busca 3
          RESPONSE=$(curl -s -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/search?query=psychology&per_page=1&orientation=landscape")
          IMG=$(echo $RESPONSE | jq -r '.photos[0].src.medium // empty')
          IMAGES[2]="${IMG:-https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=800}"
          
          # Busca 4
          RESPONSE=$(curl -s -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/search?query=curiosity&per_page=1&orientation=square")
          IMG=$(echo $RESPONSE | jq -r '.photos[0].src.medium // empty')
          IMAGES[3]="${IMG:-https://images.unsplash.com/photo-1516321317753-97ee92a35fdf?w=800}"
          
          # Busca 5
          RESPONSE=$(curl -s -H "Authorization: $PEXELS_API_KEY" \
            "https://api.pexels.com/v1/search?query=brain science&per_page=1&orientation=landscape")
          IMG=$(echo $RESPONSE | jq -r '.photos[0].src.medium // empty')
          IMAGES[4]="${IMG:-https://images.unsplash.com/photo-1518611505868-48510c2e2b3d?w=800}"
          
          # Output: todas as 5 URLs separadas por |
          IMAGE_LIST="${IMAGES[0]}|${IMAGES[1]}|${IMAGES[2]}|${IMAGES[3]}|${IMAGES[4]}"
          echo "image_urls=$IMAGE_LIST" >> $GITHUB_OUTPUT
          
          echo "🖼️  5 imagens únicas obtidas do Pexels"

      - name: Post to Pinterest (5 Pins) and Facebook (1 Post)
        env:
          IFTTT_PINTEREST_WEBHOOK: ${{ secrets.IFTTT_PINTEREST_WEBHOOK }}
          IFTTT_FACEBOOK_WEBHOOK: ${{ secrets.IFTTT_FACEBOOK_WEBHOOK }}
          ARTICLE_SLUG: ${{ steps.article-info.outputs.slug }}
          ARTICLE_URL: "https://mentecuriosa.blog/blog"
          VARIANTS_FILE: ${{ steps.variants.outputs.variants_file }}
          IMAGE_URLS: ${{ steps.images.outputs.image_urls }}
        run: |
          python3 post-to-social-v2.py

      - name: Log summary
        if: always()
        run: |
          echo "📊 Resumo da distribuição (v2)"
          echo "=============================="
          echo "Artigo: ${{ steps.article-info.outputs.slug }}"
          echo "Título: ${{ steps.metadata.outputs.title }}"
          echo "Pins Pinterest: 5 (com delay 1h cada)"
          echo "Posts Facebook: 1"
          echo "Imagens únicas: 5 (Pexels API)"
          echo "Gerador copy: Gemini API (FREE)"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=============================="
