name: Generate Pinterest CSV

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: pip install feedparser requests
      
      - name: Generate CSV
        run: |
          python3 << 'PYTHON'
          import feedparser
          import csv
          from datetime import datetime
          
          feed = feedparser.parse("https://mentecuriosa.blog/feed.xml")
          
          if not feed.entries:
              print("Sem artigos no feed")
              exit(1)
          
          latest = feed.entries[0]
          title = latest.title
          url = latest.link
          slug = url.rstrip('/').split('/')[-1]
          
          captions = [
              f"💡 {title}",
              f"🧠 Curiosidade: {title}",
              f"📚 Leia no blog: {title}",
              f"✨ Descubra: {title}",
              f"🔍 Você sabia? {title}"
          ]
          
          rows = []
          for i in range(1, 6):
              rows.append({
                  'image_url': f"https://mentecuriosa.blog/images/{slug}/image-{i}.png",
                  'description': captions[i-1],
                  'destination_url': url,
                  'board': 'Mente Curiosa'
              })
          
          with open('pinterest-pins.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=['image_url', 'description', 'destination_url', 'board'])
              writer.writeheader()
              writer.writerows(rows)
          
          print(f"✅ CSV criado: {len(rows)} pins")
          PYTHON
      
      - uses: actions/upload-artifact@v4
        with:
          name: pinterest-csv
          path: pinterest-pins.csv
          retention-days: 7
      
      - name: Commit CSV
        run: |
          git config user.name "Pinterest Bot"
          git config user.email "bot@github.com"
          mkdir -p pinterest-uploads
          cp pinterest-pins.csv pinterest-uploads/pins-$(date +%Y%m%d).csv
          git add pinterest-uploads/ || true
          git commit -m "Pinterest CSV $(date +%Y-%m-%d)" || true
          git push || true
