name: Pinterest Test - Simple Post

on:
  workflow_dispatch:

jobs:
  test-pinterest:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-driver
      
      - name: Install Selenium
        run: pip install selenium
      
      - name: Run Pinterest Test
        env:
          PINTEREST_COOKIES: ${{ secrets.PINTEREST_COOKIES }}
        run: python pinterest_test_simple.py
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pinterest-test-screenshots
          path: /tmp/pinterest_*.png
