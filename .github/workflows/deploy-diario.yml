name: Publicar no ar (deploy diário)

# Artigos com data futura só entram no site quando o site é reconstruído depois da data.
# Este fluxo reconstrói e publica todo dia cedo (06:05 no horário de Brasília), para o artigo do dia sair no horário.
on:
  schedule:
    - cron: '5 9 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Projeto da Vercel que tem o domínio www.mentecuriosa.blog (mente-curiosa-blog)
      PROJETO_ESPERADO: prj_BNFv3i9dTc2xYwAh2FQ7vMIyYTQ3
    steps:
      - name: Conferir o projeto da Vercel
        run: |
          if [ "$VERCEL_PROJECT_ID" != "$PROJETO_ESPERADO" ]; then
            echo "::error::O Secret VERCEL_PROJECT_ID não é o do projeto mente-curiosa-blog. Corrija o Secret antes de publicar."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar configuração da Vercel
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Construir
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Publicar
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # Só depois do deploy: abre o link de cada artigo do dia, confere texto e imagens e muda a planilha para "publicado".
      - name: Confirmar no ar e atualizar a planilha
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GH_TOKEN: ${{ github.token }}
          ESPERA_SEGUNDOS: '45'
        run: node scripts/automacao/confirmar-no-ar.mjs
