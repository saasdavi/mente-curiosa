name: Deploy ativado para (Vercel)

# O deploy será acionado por cron externo ou manualmente.
# Horários do cron externo (Brasília): 09:15, 12:15 e 20:15.
# O deploy hook solicita à Vercel a reconstrução do site.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy pelo deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Secret VERCEL_DEPLOY_HOOK não configurado"
            exit 1
          fi

          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null
          echo "Solicitação de deploy enviada à Vercel"
