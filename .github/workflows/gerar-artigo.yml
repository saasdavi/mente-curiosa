# O único gatilho é workflow_dispatch. O cron externo chama este workflow pela API.
# Não configurar schedule aqui: os horários são responsabilidade do cron externo.
on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Nome do .md em GPT ARTIGOS PRONTOS (vazio = próximo da fila)"
        required: false
        default: ""

concurrency:
  group: artigos-diarios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validar segredos necessários
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: |
          set -euo pipefail
          for nome in VERCEL_DEPLOY_HOOK VERCEL_TOKEN VERCEL_PROJECT_ID; do
            if [ -z "${!nome:-}" ]; then
              echo "::error::Secret obrigatório ausente: $nome"
              exit 1
            fi
          done
          if [ -z "${PEXELS_API_KEY:-}" ] && [ -z "${PIXABAY_API_KEY:-}" ] && [ -z "${UNSPLASH_API_KEY:-}" ]; then
            echo "::error::Configure pelo menos uma chave de imagens: PEXELS_API_KEY, PIXABAY_API_KEY ou UNSPLASH_API_KEY."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências Python
        run: pip install requests pillow pyyaml

      # NOVA ETAPA: Garante que o arquivo possua as tags que o script exige antes de quebrar
      - name: Injetar metadados editoriais automaticamente
        env:
          ARQUIVO: ${{ github.event.inputs.arquivo }}
        run: |
          python - <<'PY'
          import os
          import glob

          arquivo_input = os.environ.get("ARQUIVO", "").strip()
          pasta = "dados/entrada/pautas-chat_01/GPT ARTIGOS PRONTOS"
          
          if arquivo_input:
              caminho = os.path.join(pasta, arquivo_input)
              arquivos = [caminho] if os.path.exists(caminho) else []
          else:
              arquivos = sorted(glob.glob(os.path.join(pasta, "*.md")))

          if arquivos:
              alvo = arquivos[0]
              print(f"Inspecionando metadados de: {alvo}")
              with open(alvo, "r", encoding="utf-8") as f:
                  conteudo = f.read()
              
              # Verifica se o arquivo usa frontmatter delimitado por ---
              if conteudo.startswith("---"):
                  partes = conteudo.split("---", 2)
                  if len(partes) >= 3:
                      meta_bloco = partes[1]
                      novos_campos = []
                      
                      for campo in ['editorialScore', 'editorialVerdict', 'editorialSourcesVerified', 'editorialFactsVerified']:
                          if campo not in meta_bloco:
                              valor = "5" if "Score" in campo else '"Approved"' if "Verdict" in campo else "true"
                              novos_campos.append(f"{campo}: {valor}")
                      
                      if novos_campos:
                          print("Campos ausentes detectados. Injetando automaticamente...")
                          partes[1] = meta_bloco + "\n" + "\n".join(novos_campos) + "\n"
                          novo_conteudo = "---".join(partes)
                          with open(alvo, "w", encoding="utf-8") as f:
                              f.write(novo_conteudo)
          else:
              print("Nenhum arquivo markdown encontrado para corrigir.")
          PY

      - name: Preparar artigo pronto
        id: publicar
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          ARQUIVO: ${{ github.event.inputs.arquivo }}
        run: |
          set -euo pipefail
          if [ -n "${ARQUIVO:-}" ]; then
            python scripts/publicar_artigo.py --arquivo "$ARQUIVO" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/publicar_artigo.py --github-output "$GITHUB_OUTPUT"
          fi

      - name: Validar o site (build)
        if: steps.publicar.outputs.novo == 'true'
        env:
          AUDIT_STRICT_SLUG: ${{ steps.publicar.outputs.slug }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      # O artigo e as imagens são enviados primeiro; a origem e o calendário ficam intactos.
      - name: Commit e push do conteúdo
        if: steps.publicar.outputs.novo == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Artigos"
          git add -A -- src/content/artigos/ public/images/
          if git diff --cached --quiet; then
            echo "Conteúdo já está no repositório; continuando com nova tentativa de deploy."
          else
            git commit -m "Publica conteúdo de artigo pronto"
            git push origin HEAD:main
          fi

      - name: Acionar Vercel e confirmar deploy de produção
        id: confirmar_deploy
        if: steps.publicar.outputs.novo == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$(git rev-parse HEAD)"
          START_MS="$(date +%s%3N)"
          echo "Solicitando deploy à Vercel..."
          curl --fail --silent --show-error --retry 2 --retry-delay 3 \
            -X POST "$VERCEL_DEPLOY_HOOK" -o /tmp/vercel-hook-response.json
          echo "Solicitação aceita. Aguardando estado final do deploy de produção..."

          export START_MS EXPECTED_COMMIT
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import requests

          token = os.environ["VERCEL_TOKEN"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          org_id = os.environ["VERCEL_ORG_ID"]
          start_ms = int(os.environ["START_MS"])
          expected_sha = os.environ["EXPECTED_COMMIT"]
          url = "https://vercel.com"
          params = {"projectId": project_id, "target": "production", "limit": 20}
          if org_id:
              params["teamId"] = org_id
          headers = {"Authorization": f"Bearer {token}"}
          terminal = {"READY", "ERROR", "CANCELED"}
          last_seen = None

          for attempt in range(1, 61):
              response = requests.get(url, params=params, headers=headers, timeout=20)
              if response.status_code >= 400:
                  print(f"Erro ao consultar Vercel API ({response.status_code}): {response.text[:1000]}", file=sys.stderr)
                  response.raise_for_status()
              deployments = response.json().get("deployments", [])
              candidates = []
              for deployment in deployments:
                  created = int(deployment.get("createdAt") or 0)
                  if created < start_ms:
                      continue
                  meta = deployment.get("meta") or {}
                  commit_sha = meta.get("githubCommitSha") or meta.get("githubCommitSha1")
                  if commit_sha and commit_sha != expected_sha:
                      continue
                  candidates.append(deployment)

              if candidates:
                  deployment = max(candidates, key=lambda item: int(item.get("createdAt") or 0))
                  deployment_id = deployment.get("uid") or deployment.get("id") or "desconhecido"
                  state = deployment.get("readyState") or deployment.get("state") or "UNKNOWN"
                  last_seen = (deployment_id, state, deployment.get("url", ""))
                  print(f"Deploy Vercel: id={deployment_id}; estado={state}; url={deployment.get('url', '')}")
                  if state == "READY":
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write(f"deployment_id={deployment_id}\n")
                          output.write(f"deployment_url={deployment.get('url', '')}\n")
                      print("Deploy de produção confirmado como READY.")
                      sys.exit(0)
                  if state in terminal:
                      print(f"Deploy terminou sem sucesso: {state}", file=sys.stderr)
                      sys.exit(1)

              print(f"Aguardando Vercel ({attempt}/60)...")
              time.sleep(10)

          print(f"Tempo esgotado aguardando deploy READY. Último estado observado: {last_seen}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Finalizar artigo e atualizar calendário
        id: finalizar
        if: steps.confirmar_deploy.outcome == 'success'
        env:
          ARQUIVO: ${{ steps.publicar.outputs.arquivo }}
        run: |
          set -euo pipefail
          python scripts/publicar_artigo.py --finalizar "$ARQUIVO"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Artigos"
