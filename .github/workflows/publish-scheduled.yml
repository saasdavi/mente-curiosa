name: Publish Scheduled Articles

on:
  schedule:
    # Publica a cada 2 horas (verifica se há drafts)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish scheduled articles
        run: npm run publish:scheduled

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: published scheduled articles $(date +%d/%m/%Y\ %H:%M)" || true
          git push
