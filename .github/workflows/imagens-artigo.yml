# Imagens com SEO para um artigo: capa + 5 Pins + fotos no corpo, com foto grátis e crédito.
# Rodar em Actions → "Imagens do artigo" → Run workflow (ou pelo n8n via API do GitHub).
name: Imagens do artigo

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo (ex.: por-que-o-ceu-e-azul)'
        required: true
      capa_busca:
        description: 'Busca da foto da capa, em inglês (vazio = mantém a capa atual)'
        required: false
      capa_alt:
        description: 'Alt da capa em português (o que aparece na foto)'
        required: false
      fotos:
        description: 'Fotos do corpo: busca | alt | legenda | seção  — separe várias com ;;'
        required: false
      fontes:
        description: 'Ordem das fontes grátis'
        default: 'pexels,nasa,openverse'

permissions:
  contents: write

concurrency:
  group: imagens-artigo
  cancel-in-progress: false

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pyyaml
      - name: Gerar imagens
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SLUG: ${{ inputs.slug }}
          CAPA_BUSCA: ${{ inputs.capa_busca }}
          CAPA_ALT: ${{ inputs.capa_alt }}
          FOTOS: ${{ inputs.fotos }}
          FONTES: ${{ inputs.fontes }}
        run: |
          args=(--slug "$SLUG" --fontes "$FONTES")
          if [ -n "$CAPA_BUSCA" ]; then args+=(--capa-busca "$CAPA_BUSCA" --capa-alt "$CAPA_ALT"); else args+=(--sem-capa); fi
          if [ -n "$FOTOS" ]; then
            while IFS= read -r f; do
              f="$(echo "$f" | sed 's/^ *//;s/ *$//')"
              [ -n "$f" ] && args+=(--foto "$f")
            done < <(printf '%s\n' "$FOTOS" | sed 's/;;/\n/g')  # \n final: sem ele o read perde a última foto
          fi
          python3 scripts/imagens/imagens_artigo.py "${args[@]}"
      - name: Publicar
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          # Commit em nome de quem disparou o workflow: a Vercel (plano Hobby) só publica commits de autores do time.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A "public/images/$SLUG" "public/social/$SLUG" "src/content/artigos/$SLUG.md"
          git diff --cached --quiet && { echo "nada mudou"; exit 0; }
          git commit -m "Imagens com SEO: $SLUG"
          git push
