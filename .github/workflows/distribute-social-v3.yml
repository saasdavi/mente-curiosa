name: Social Distribution v3 (5 Perfis Pinterest)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publicação Agendada"]
    types: [completed]
  schedule:
    - cron: "1 0,8,16 * * *"  # 00:01, 08:00, 16:00 UTC

jobs:
  distribute-pinterest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install py3-pinterest google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Distribute to 5 Pinterest Profiles
        env:
          PINTEREST_PASS_1: ${{ secrets.PINTEREST_PASS_1 }}
          PINTEREST_PASS_2: ${{ secrets.PINTEREST_PASS_2 }}
          PINTEREST_PASS_3: ${{ secrets.PINTEREST_PASS_3 }}
          PINTEREST_PASS_4: ${{ secrets.PINTEREST_PASS_4 }}
          PINTEREST_PASS_5: ${{ secrets.PINTEREST_PASS_5 }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          WORKSHEET_NAME: "pautas-modelo_pautas"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/post-to-social-pinterest.py

      - name: Log Results
        if: always()
        run: echo "✅ Distribution completed at $(date)"

