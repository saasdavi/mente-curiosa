name: Social Distribution v3 (5 Perfis Pinterest)

on:
  workflow_run:
    workflows: ["Publicação Agendada"]
    types: [completed]
  schedule:
    - cron: "1 0,8,16 * * *"  # 00:01, 08:00, 16:00 UTC

jobs:
  distribute-pinterest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install @anthropic-ai/sdk
          pip install requests

      - name: Distribute to 5 Pinterest Profiles
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IFTTT_PINTEREST_PROFILE_1: ${{ secrets.IFTTT_PINTEREST_PROFILE_1 }}
          IFTTT_PINTEREST_PROFILE_2: ${{ secrets.IFTTT_PINTEREST_PROFILE_2 }}
          IFTTT_PINTEREST_PROFILE_3: ${{ secrets.IFTTT_PINTEREST_PROFILE_3 }}
          IFTTT_PINTEREST_PROFILE_4: ${{ secrets.IFTTT_PINTEREST_PROFILE_4 }}
          IFTTT_PINTEREST_PROFILE_5: ${{ secrets.IFTTT_PINTEREST_PROFILE_5 }}
        run: |
          python scripts/post-to-social-v3.py

      - name: Log Results
        if: always()
        run: echo "✅ Distribution completed at $(date)"
